<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026年保險業風險管理趨勢論壇 · 電子票卡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --ink:#1B2A4A;
    --ink-soft:#2E3F63;
    --gold:#C9A227;
    --gold-soft:#E4C766;
    --crimson:#8B2635;
    --ivory:#FAF7F0;
    --paper:#FFFFFF;
    --line:#E4DFD3;
    --text:#2B2B28;
    --text-dim:#6B6558;
    --radius:14px;
    --shadow:0 8px 30px rgba(27,42,74,0.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;overflow-x:hidden;max-width:100%;}
  body{
    background:var(--ivory);
    color:var(--text);
    font-family:'Noto Sans TC',sans-serif;
    min-height:100vh;
    line-height:1.6;
  }
  .bg-band{
    background:linear-gradient(160deg, var(--ink) 0%, var(--ink-soft) 55%, var(--crimson) 130%);
    padding:48px 20px 90px;
    position:relative;
    overflow:hidden;
  }
  .bg-band::after{
    content:"";
    position:absolute;
    right:-60px; top:-60px;
    width:260px; height:260px;
    border:1px solid rgba(201,162,39,0.35);
    border-radius:50%;
  }
  .bg-band::before{
    content:"";
    position:absolute;
    left:-40px; bottom:-90px;
    width:200px; height:200px;
    border:1px solid rgba(201,162,39,0.25);
    border-radius:50%;
  }
  .eyebrow{
    color:var(--gold-soft);
    font-size:13px;
    letter-spacing:0.32em;
    text-transform:uppercase;
    text-align:center;
    margin:0 0 10px;
    position:relative;
  }
  h1.title{
    font-family:'Noto Serif TC',serif;
    font-weight:900;
    color:#fff;
    text-align:center;
    font-size:clamp(26px,6vw,38px);
    margin:0 0 8px;
    position:relative;
    letter-spacing:0.02em;
  }
  .subtitle{
    text-align:center;
    color:rgba(255,255,255,0.78);
    font-size:14px;
    margin:0;
    position:relative;
  }
  .wrap{
    max-width:520px;
    margin:-56px auto 40px;
    padding:0 16px;
    position:relative;
    z-index:2;
  }
  .card{
    background:var(--paper);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:26px 22px;
    margin-bottom:18px;
  }
  .lookup-card h2{
    font-family:'Noto Serif TC',serif;
    font-size:19px;
    margin:0 0 4px;
    color:var(--ink);
  }
  .lookup-card p.hint{
    font-size:13px;
    color:var(--text-dim);
    margin:0 0 18px;
  }
  .input-row{
    display:flex;
    gap:10px;
    min-width:0;
  }
  input#codeInput{
    flex:1;
    min-width:0;
    padding:14px 16px;
    border:1.5px solid var(--line);
    border-radius:10px;
    font-size:16px;
    font-family:'Noto Sans TC',sans-serif;
    letter-spacing:0.03em;
    outline:none;
    transition:border-color .2s;
  }
  input#codeInput:focus{border-color:var(--gold);}
  button.btn{
    background:var(--ink);
    color:#fff;
    border:none;
    border-radius:10px;
    padding:0 22px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    font-family:'Noto Sans TC',sans-serif;
    transition:background .2s;
    white-space:nowrap;
  }
  button.btn:hover{background:var(--ink-soft);}
  button.btn:disabled{opacity:0.6;cursor:default;}

  .msg{
    font-size:13px;
    margin-top:12px;
    padding:10px 12px;
    border-radius:8px;
    display:none;
  }
  .msg.show{display:block;}
  .msg.error{background:#FBEAE9;color:#9A3B34;}

  /* ticket card */
  .ticket{display:none;}
  .ticket.show{display:block;}
  .ticket-card{
    background:linear-gradient(135deg, var(--ink) 0%, var(--ink-soft) 100%);
    border-radius:var(--radius);
    padding:0;
    overflow:hidden;
    box-shadow:var(--shadow);
    color:#fff;
    position:relative;
  }
  .ticket-top{
    padding:22px 22px 18px;
    position:relative;
  }
  .cat-badge{
    display:inline-block;
    font-size:11px;
    letter-spacing:0.14em;
    padding:4px 10px;
    border-radius:20px;
    background:rgba(201,162,39,0.22);
    border:1px solid var(--gold-soft);
    color:var(--gold-soft);
    margin-bottom:12px;
  }
  .ticket-name{
    font-family:'Noto Serif TC',serif;
    font-size:24px;
    font-weight:700;
    margin:0 0 4px;
  }
  .ticket-org{
    font-size:13px;
    color:rgba(255,255,255,0.75);
    margin:0;
  }
  .ticket-divider{
    border-top:1px dashed rgba(255,255,255,0.28);
    margin:18px 0;
    position:relative;
  }
  .ticket-divider::before,.ticket-divider::after{
    content:"";
    position:absolute;
    top:-9px;
    width:18px;height:18px;
    background:var(--ivory);
    border-radius:50%;
  }
  .ticket-divider::before{left:-31px;}
  .ticket-divider::after{right:-31px;}
  .ticket-meta{
    display:flex;
    gap:24px;
  }
  .meta-item .label{
    font-size:11px;
    letter-spacing:0.1em;
    color:rgba(255,255,255,0.55);
    text-transform:uppercase;
    margin-bottom:4px;
  }
  .meta-item .value{
    font-size:22px;
    font-weight:700;
    font-family:'Noto Serif TC',serif;
  }
  .ticket-code-row{
    background:rgba(0,0,0,0.18);
    padding:12px 22px;
    font-size:12px;
    letter-spacing:0.14em;
    color:rgba(255,255,255,0.7);
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .qr-wrap{
    background:#fff;
    padding:22px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
  }
  .qr-wrap #qrcodeBox{
    padding:10px;
    border:1px solid var(--line);
    border-radius:10px;
    background:#fff;
  }
  .qr-hint{
    font-size:12px;
    color:var(--text-dim);
    text-align:center;
  }

  /* agenda */
  .tabs{
    display:flex;
    gap:6px;
    margin-bottom:16px;
  }
  .tab{
    flex:1;
    text-align:center;
    padding:9px 4px;
    border-radius:8px;
    font-size:13px;
    font-weight:700;
    color:var(--text-dim);
    background:var(--ivory);
    cursor:pointer;
    border:1px solid var(--line);
  }
  .tab.active{
    background:var(--ink);
    color:#fff;
    border-color:var(--ink);
  }
  .agenda-item{
    display:flex;
    gap:14px;
    padding:12px 0;
    border-bottom:1px solid var(--line);
  }
  .agenda-item:last-child{border-bottom:none;}
  .agenda-time{
    flex:0 0 64px;
    font-size:12px;
    color:var(--gold);
    font-weight:700;
    padding-top:2px;
  }
  .agenda-title{
    font-size:14px;
    font-weight:700;
    color:var(--ink);
    margin:0 0 2px;
  }
  .agenda-sub{
    font-size:12px;
    color:var(--text-dim);
    margin:0;
  }

  .card h3.section-title{
    font-family:'Noto Serif TC',serif;
    font-size:16px;
    margin:0 0 14px;
    color:var(--ink);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .card h3.section-title::before{
    content:"";
    width:4px;height:16px;
    background:var(--gold);
    border-radius:2px;
    display:inline-block;
  }

  .ann-item{
    padding:12px 0;
    border-bottom:1px solid var(--line);
    font-size:13px;
  }
  .ann-item:last-child{border-bottom:none;}
  .ann-time{
    font-size:11px;
    color:var(--text-dim);
    margin-bottom:3px;
  }

  .loading{
    text-align:center;
    padding:16px;
    color:var(--text-dim);
    font-size:13px;
  }
  footer{
    text-align:center;
    font-size:12px;
    color:var(--text-dim);
    padding:24px 20px 20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
  }
  footer img.credit-logo{
    height:18px;
    opacity:0.7;
  }
  footer .credit-label{
    font-size:11px;
    color:var(--text-dim);
    letter-spacing:0.04em;
  }
</style>
</head>
<body>

<div class="bg-band">
  <h1 class="title">2026年保險業風險管理趨勢論壇</h1>
  <p class="subtitle">財團法人保險安定基金 主辦 · 台北 晶華酒店3樓宴會廳 2026/11/16(一)</p>
</div>

<div class="wrap">

  <!-- 查票卡 -->
  <div class="card lookup-card" id="lookupCard">
    <h2>開啟我的電子票卡</h2>
    <p class="hint">請輸入審核通過通知信中的票卡代碼(例如 ERM001)</p>
    <div class="input-row">
      <input type="text" id="codeInput" placeholder="ERM001" autocomplete="off">
      <button class="btn" id="lookupBtn">查詢</button>
    </div>
    <div class="msg error" id="errMsg"></div>
  </div>

  <!-- 票卡結果 -->
  <div class="ticket" id="ticketSection">
    <div class="ticket-card">
      <div class="ticket-top">
        <span class="cat-badge" id="ticketCategory">貴賓</span>
        <p class="ticket-name" id="ticketName">—</p>
        <p class="ticket-org" id="ticketOrg">—</p>
        <div class="ticket-divider"></div>
        <div class="ticket-meta">
          <div class="meta-item">
            <div class="label">桌次 Table</div>
            <div class="value" id="ticketTable">—</div>
          </div>
          <div class="meta-item">
            <div class="label">座位 Seat</div>
            <div class="value" id="ticketSeat">—</div>
          </div>
        </div>
      </div>
      <div class="ticket-code-row">
        <span>TICKET CODE</span>
        <span id="ticketCodeLabel">—</span>
      </div>
      <div class="qr-wrap">
        <div id="qrcodeBox"></div>
        <p class="qr-hint">請於報到處出示此 QR Code 供工作人員掃描</p>
      </div>
    </div>

    <!-- 議程 -->
    <div class="card" style="margin-top:18px;">
      <h3 class="section-title">三日議程</h3>
      <div class="tabs" id="agendaTabs"></div>
      <div id="agendaList">
        <div class="loading">載入議程中…</div>
      </div>
    </div>

    <!-- 公告 -->
    <div class="card">
      <h3 class="section-title">大會公告</h3>
      <div id="annList">
        <div class="loading">載入公告中…</div>
      </div>
    </div>
  </div>

</div>

<script>
/* ============================================================
   請把下面這行改成你部署好的 GAS Web App URL
   例如：https://script.google.com/macros/s/AKfycb.../exec
   ============================================================ */
const API_URL = 'https://script.google.com/macros/s/AKfycbyWqfxD9QCtjTYCEPwBzHPJk42BkdFdM4zQUAANmqeoXTH6e7OvBBVkDIMx3oli1LDFqg/exec';

const els = {
  codeInput: document.getElementById('codeInput'),
  lookupBtn: document.getElementById('lookupBtn'),
  errMsg: document.getElementById('errMsg'),
  lookupCard: document.getElementById('lookupCard'),
  ticketSection: document.getElementById('ticketSection'),
  ticketName: document.getElementById('ticketName'),
  ticketOrg: document.getElementById('ticketOrg'),
  ticketTable: document.getElementById('ticketTable'),
  ticketSeat: document.getElementById('ticketSeat'),
  ticketCategory: document.getElementById('ticketCategory'),
  ticketCodeLabel: document.getElementById('ticketCodeLabel'),
  agendaTabs: document.getElementById('agendaTabs'),
  agendaList: document.getElementById('agendaList'),
  annList: document.getElementById('annList'),
};

let agendaData = [];
let currentDay = null;

function showError(text){
  els.errMsg.textContent = text;
  els.errMsg.classList.add('show');
}
function clearError(){
  els.errMsg.classList.remove('show');
  els.errMsg.textContent = '';
}

async function lookupTicket(){
  const code = els.codeInput.value.trim();
  if(!code){
    showError('請輸入票卡代碼');
    return;
  }
  clearError();
  els.lookupBtn.disabled = true;
  els.lookupBtn.textContent = '查詢中…';

  try {
    const res = await fetch(`${API_URL}?action=getTicket&code=${encodeURIComponent(code)}`);
    const json = await res.json();

    if(!json.success){
      showError(json.message || '查無此票卡代碼');
      els.ticketSection.classList.remove('show');
      return;
    }

    renderTicket(json.data);
    els.ticketSection.classList.add('show');
    loadAgenda();
    loadAnnouncements();
    els.ticketSection.scrollIntoView({behavior:'smooth', block:'start'});

  } catch(err){
    showError('連線失敗，請稍後再試');
    console.error(err);
  } finally {
    els.lookupBtn.disabled = false;
    els.lookupBtn.textContent = '查詢';
  }
}

function renderTicket(data){
  els.ticketName.textContent = data.Name || '—';
  els.ticketOrg.textContent = data.Organization || '';
  els.ticketTable.textContent = data.TableNo || '—';
  els.ticketSeat.textContent = data.SeatNo || '—';
  els.ticketCategory.textContent = data.Category || '一般';
  els.ticketCodeLabel.textContent = data.TicketCode || '';
  renderQrCode(data.TicketCode);
}

let qrInstance = null;
function renderQrCode(code){
  const box = document.getElementById('qrcodeBox');
  box.innerHTML = ''; // 清空前一次的 QR，避免重疊
  if(!code) return;
  qrInstance = new QRCode(box, {
    text: code,
    width: 180,
    height: 180,
    colorDark: '#1B2A4A',
    colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.M
  });
}

async function loadAgenda(){
  try {
    const res = await fetch(`${API_URL}?action=getAgenda`);
    const json = await res.json();
    if(!json.success){
      els.agendaList.innerHTML = '<div class="loading">議程尚未公布</div>';
      return;
    }
    agendaData = json.data;
    renderAgendaTabs();
  } catch(err){
    els.agendaList.innerHTML = '<div class="loading">載入失敗</div>';
  }
}

function renderAgendaTabs(){
  const days = [...new Set(agendaData.map(a => a.Day))];
  currentDay = days[0];
  els.agendaTabs.innerHTML = days.map(d => {
    const label = agendaData.find(a => a.Day === d)?.DateText || d;
    return `<div class="tab ${d===currentDay?'active':''}" data-day="${d}">${label}</div>`;
  }).join('');

  els.agendaTabs.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      currentDay = tab.dataset.day;
      els.agendaTabs.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      renderAgendaList();
    });
  });

  renderAgendaList();
}

function renderAgendaList(){
  const items = agendaData.filter(a => a.Day === currentDay);
  if(items.length === 0){
    els.agendaList.innerHTML = '<div class="loading">此日尚無議程</div>';
    return;
  }
  els.agendaList.innerHTML = items.map(a => `
    <div class="agenda-item">
      <div class="agenda-time">${a.StartTime}<br>${a.EndTime}</div>
      <div>
        <p class="agenda-title">${a.SessionTitle}</p>
        <p class="agenda-sub">${[a.Speaker, a.Location].filter(Boolean).join(' · ')}</p>
      </div>
    </div>
  `).join('');
}

async function loadAnnouncements(){
  try {
    const res = await fetch(`${API_URL}?action=getAnnouncements`);
    const json = await res.json();
    if(!json.success || json.data.length === 0){
      els.annList.innerHTML = '<div class="loading">目前尚無公告</div>';
      return;
    }
    els.annList.innerHTML = json.data.map(a => `
      <div class="ann-item">
        <div class="ann-time">${formatTime(a.Timestamp)}</div>
        <div>${a.Content}</div>
      </div>
    `).join('');
  } catch(err){
    els.annList.innerHTML = '<div class="loading">載入失敗</div>';
  }
}

function formatTime(ts){
  if(!ts) return '';
  const d = new Date(ts);
  if(isNaN(d)) return ts;
  return d.toLocaleString('zh-TW', {month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'});
}

els.lookupBtn.addEventListener('click', lookupTicket);
els.codeInput.addEventListener('keydown', e => {
  if(e.key === 'Enter') lookupTicket();
});
</script>

</body>
</html>
