<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工作人員後台 · 2026年保險業風險管理趨勢論壇</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --ink:#1B2A4A;
    --ink-soft:#2E3F63;
    --gold:#C9A227;
    --gold-soft:#E4C766;
    --crimson:#8B2635;
    --ivory:#FAF7F0;
    --paper:#FFFFFF;
    --line:#E4DFD3;
    --text:#2B2B28;
    --text-dim:#6B6558;
    --green:#2F7D4F;
    --red:#C24B42;
    --amber:#B8862B;
    --radius:14px;
    --shadow:0 8px 30px rgba(27,42,74,0.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ivory);
    color:var(--text);
    font-family:'Noto Sans TC',sans-serif;
    min-height:100vh;
    line-height:1.6;
  }

  /* ---------- 登入畫面 ---------- */
  #loginScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(160deg, var(--ink) 0%, var(--ink-soft) 55%, var(--crimson) 130%);
    padding:20px;
  }
  .login-card{
    background:var(--paper);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:36px 30px;
    width:100%;
    max-width:380px;
  }
  .login-eyebrow{
    color:var(--gold);
    font-size:12px;
    letter-spacing:0.24em;
    text-transform:uppercase;
    text-align:center;
    margin:0 0 8px;
  }
  .login-title{
    font-family:'Noto Serif TC',serif;
    font-size:22px;
    font-weight:900;
    text-align:center;
    color:var(--ink);
    margin:0 0 28px;
  }
  .field{margin-bottom:16px;}
  .field label{
    display:block;
    font-size:12px;
    color:var(--text-dim);
    margin-bottom:6px;
    letter-spacing:0.04em;
  }
  .field input{
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--line);
    border-radius:10px;
    font-size:15px;
    font-family:'Noto Sans TC',sans-serif;
    outline:none;
    transition:border-color .2s;
  }
  .field input:focus{border-color:var(--gold);}
  .btn-primary{
    width:100%;
    background:var(--ink);
    color:#fff;
    border:none;
    border-radius:10px;
    padding:13px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    font-family:'Noto Sans TC',sans-serif;
    transition:background .2s;
    margin-top:6px;
  }
  .btn-primary:hover{background:var(--ink-soft);}
  .btn-primary:disabled{opacity:0.6;cursor:default;}
  .login-error{
    font-size:13px;
    color:var(--red);
    background:#FBEAE9;
    padding:10px 12px;
    border-radius:8px;
    margin-top:14px;
    display:none;
  }
  .login-error.show{display:block;}

  /* ---------- 主畫面 ---------- */
  #mainScreen{display:none;}
  #mainScreen.show{display:block;}

  .topbar{
    background:var(--ink);
    color:#fff;
    padding:14px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .topbar-title{
    font-family:'Noto Serif TC',serif;
    font-size:15px;
    font-weight:700;
  }
  .topbar-user{
    font-size:12px;
    color:rgba(255,255,255,0.7);
    display:flex;
    align-items:center;
    gap:10px;
  }
  .logout-btn{
    background:none;
    border:1px solid rgba(255,255,255,0.35);
    color:#fff;
    padding:5px 10px;
    border-radius:6px;
    font-size:12px;
    cursor:pointer;
  }

  .tabbar{
    display:flex;
    background:var(--paper);
    border-bottom:1px solid var(--line);
    position:sticky;
    top:0;
    z-index:10;
  }
  .tabbar-item{
    flex:1;
    text-align:center;
    padding:13px 4px;
    font-size:13px;
    font-weight:700;
    color:var(--text-dim);
    cursor:pointer;
    border-bottom:3px solid transparent;
  }
  .tabbar-item.active{
    color:var(--ink);
    border-bottom-color:var(--gold);
  }

  .panel{display:none;padding:18px 16px 40px;max-width:520px;margin:0 auto;}
  .panel.active{display:block;}

  .card{
    background:var(--paper);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:20px;
    margin-bottom:16px;
  }

  /* 掃描頁 */
  #qr-reader{
    border-radius:var(--radius);
    overflow:hidden;
    margin-bottom:16px;
  }
  .scan-result{
    border-radius:var(--radius);
    padding:20px;
    text-align:center;
    display:none;
  }
  .scan-result.show{display:block;}
  .scan-result.success{background:#EAF6EE;border:2px solid var(--green);}
  .scan-result.duplicate{background:#FDF6E6;border:2px solid var(--amber);}
  .scan-result.notfound{background:#FBEAE9;border:2px solid var(--red);}
  .scan-icon{font-size:36px;margin-bottom:8px;}
  .scan-name{font-family:'Noto Serif TC',serif;font-size:20px;font-weight:700;margin:0 0 4px;}
  .scan-detail{font-size:13px;color:var(--text-dim);}

  /* 搜尋頁 */
  .search-row{display:flex;gap:8px;margin-bottom:16px;}
  .search-row input{
    flex:1;
    padding:12px 14px;
    border:1.5px solid var(--line);
    border-radius:10px;
    font-size:15px;
  }
  .search-row button{
    background:var(--ink);
    color:#fff;
    border:none;
    border-radius:10px;
    padding:0 18px;
    font-weight:700;
    cursor:pointer;
  }
  .result-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 0;
    border-bottom:1px solid var(--line);
  }
  .result-item:last-child{border-bottom:none;}
  .result-info .name{font-weight:700;font-size:14px;color:var(--ink);}
  .result-info .meta{font-size:12px;color:var(--text-dim);}
  .checkin-btn{
    background:var(--gold);
    color:var(--ink);
    border:none;
    border-radius:8px;
    padding:8px 14px;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
    white-space:nowrap;
  }
  .checkin-btn:disabled{
    background:var(--line);
    color:var(--text-dim);
    cursor:default;
  }

  /* 總覽頁 */
  .stat-row{display:flex;gap:12px;margin-bottom:16px;}
  .stat-box{
    flex:1;
    background:var(--paper);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:18px;
    text-align:center;
  }
  .stat-num{font-family:'Noto Serif TC',serif;font-size:28px;font-weight:900;color:var(--ink);}
  .stat-label{font-size:11px;color:var(--text-dim);letter-spacing:0.06em;margin-top:4px;}
  .log-item{
    display:flex;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px solid var(--line);
    font-size:13px;
  }
  .log-item:last-child{border-bottom:none;}
  .log-time{color:var(--text-dim);font-size:11px;}

  .card h3.section-title{
    font-family:'Noto Serif TC',serif;
    font-size:15px;
    margin:0 0 14px;
    color:var(--ink);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .card h3.section-title::before{
    content:"";
    width:4px;height:14px;
    background:var(--gold);
    border-radius:2px;
    display:inline-block;
  }

  .loading{text-align:center;padding:16px;color:var(--text-dim);font-size:13px;}
</style>
</head>
<body>

<!-- ============ 登入畫面 ============ -->
<div id="loginScreen">
  <div class="login-card">
    <p class="login-eyebrow">Staff Access</p>
    <h1 class="login-title">工作人員登入</h1>
    <div class="field">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="staff01@example.org" autocomplete="username">
    </div>
    <div class="field">
      <label>密碼</label>
      <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn-primary" id="loginBtn">登入</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- ============ 主畫面 ============ -->
<div id="mainScreen">
  <div class="topbar">
    <span class="topbar-title">工作人員後台</span>
    <span class="topbar-user">
      <span id="staffNameLabel">—</span>
      <button class="logout-btn" id="logoutBtn">登出</button>
    </span>
  </div>

  <div class="tabbar">
    <div class="tabbar-item active" data-panel="scanPanel">掃碼報到</div>
    <div class="tabbar-item" data-panel="searchPanel">人員搜尋</div>
    <div class="tabbar-item" data-panel="overviewPanel">總覽</div>
  </div>

  <!-- 掃碼報到 -->
  <div class="panel active" id="scanPanel">
    <div class="card">
      <h3 class="section-title">掃描 QR Code</h3>
      <div id="qr-reader"></div>
      <div class="scan-result" id="scanResult">
        <div class="scan-icon" id="scanIcon">✓</div>
        <p class="scan-name" id="scanName">—</p>
        <p class="scan-detail" id="scanDetail">—</p>
      </div>
    </div>
  </div>

  <!-- 人員搜尋 -->
  <div class="panel" id="searchPanel">
    <div class="card">
      <h3 class="section-title">手動搜尋報到</h3>
      <div class="search-row">
        <input type="text" id="searchInput" placeholder="輸入姓名、單位或票卡代碼">
        <button id="searchBtn">搜尋</button>
      </div>
      <div id="searchResults"></div>
    </div>
  </div>

  <!-- 總覽 -->
  <div class="panel" id="overviewPanel">
    <div class="stat-row">
      <div class="stat-box">
        <div class="stat-num" id="statTotal">—</div>
        <div class="stat-label">總人數</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="statCheckedIn">—</div>
        <div class="stat-label">已報到</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="statRemaining">—</div>
        <div class="stat-label">未報到</div>
      </div>
    </div>
    <div class="card">
      <h3 class="section-title">最近報到紀錄</h3>
      <div id="recentLog"><div class="loading">載入中…</div></div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   請把下面這行改成你部署好的 GAS Web App URL（結尾 /exec）
   ============================================================ */
const API_URL = 'PUT_YOUR_GAS_WEB_APP_URL_HERE';

let sessionToken = sessionStorage.getItem('erm_token') || null;
let staffName = sessionStorage.getItem('erm_name') || '';
let qrScanner = null;
let scanCooldown = false;

const el = id => document.getElementById(id);

// ---------- 登入 ----------
el('loginBtn').addEventListener('click', doLogin);
el('loginPassword').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

async function doLogin(){
  const email = el('loginEmail').value.trim();
  const password = el('loginPassword').value;
  if(!email || !password){
    showLoginError('請輸入 Email 與密碼');
    return;
  }
  el('loginBtn').disabled = true;
  el('loginBtn').textContent = '登入中…';

  try{
    const res = await fetch(API_URL, {
      method:'POST',
      body: JSON.stringify({ action:'login', email, password })
    });
    const json = await res.json();
    if(!json.success){
      showLoginError(json.message || '登入失敗');
      return;
    }
    sessionToken = json.data.token;
    staffName = json.data.name;
    sessionStorage.setItem('erm_token', sessionToken);
    sessionStorage.setItem('erm_name', staffName);
    enterMainScreen();
  } catch(err){
    showLoginError('連線失敗，請稍後再試');
    console.error(err);
  } finally {
    el('loginBtn').disabled = false;
    el('loginBtn').textContent = '登入';
  }
}

function showLoginError(msg){
  el('loginError').textContent = msg;
  el('loginError').classList.add('show');
}

el('logoutBtn').addEventListener('click', () => {
  sessionStorage.removeItem('erm_token');
  sessionStorage.removeItem('erm_name');
  sessionToken = null;
  location.reload();
});

function enterMainScreen(){
  el('loginScreen').style.display = 'none';
  el('mainScreen').classList.add('show');
  el('staffNameLabel').textContent = staffName;
  startScanner();
  loadOverview();
}

// ---------- Tab 切換 ----------
document.querySelectorAll('.tabbar-item').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tabbar-item').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    el(tab.dataset.panel).classList.add('active');
    if(tab.dataset.panel === 'overviewPanel') loadOverview();
  });
});

// ---------- 掃碼報到 ----------
function startScanner(){
  if(qrScanner) return;
  qrScanner = new Html5Qrcode('qr-reader');
  qrScanner.start(
    { facingMode: 'environment' },
    { fps: 10, qrbox: 240 },
    onScanSuccess,
    () => {} // 忽略掃描失敗的雜訊
  ).catch(err => {
    console.error('無法啟動相機', err);
  });
}

async function onScanSuccess(decodedText){
  if(scanCooldown) return;
  scanCooldown = true;
  await checkin(decodedText.trim(), 'QR');
  setTimeout(() => { scanCooldown = false; }, 2000); // 2秒冷卻避免重複掃到同一張
}

async function checkin(code, method){
  try{
    const res = await fetch(API_URL, {
      method:'POST',
      body: JSON.stringify({ action:'checkin', token: sessionToken, code, method })
    });
    const json = await res.json();
    renderScanResult(json);
    return json;
  } catch(err){
    renderScanResult({ success:false, status:'error', message:'連線失敗' });
  }
}

function renderScanResult(json){
  const box = el('scanResult');
  box.classList.remove('success','duplicate','notfound');
  box.classList.add('show');

  if(json.success){
    box.classList.add('success');
    el('scanIcon').textContent = '✓';
    el('scanName').textContent = json.data.name;
    el('scanDetail').textContent = `${json.data.organization || ''} · 桌次 ${json.data.tableNo || '—'} / 座位 ${json.data.seatNo || '—'}`;
  } else if(json.status === 'AlreadyCheckedIn'){
    box.classList.add('duplicate');
    el('scanIcon').textContent = '⚠';
    el('scanName').textContent = json.data?.name || '已報到';
    el('scanDetail').textContent = json.message;
  } else {
    box.classList.add('notfound');
    el('scanIcon').textContent = '✕';
    el('scanName').textContent = '查無此人';
    el('scanDetail').textContent = json.message || '請確認票卡代碼或改用人員搜尋';
  }
}

// ---------- 人員搜尋 ----------
el('searchBtn').addEventListener('click', doSearch);
el('searchInput').addEventListener('keydown', e => { if(e.key==='Enter') doSearch(); });

async function doSearch(){
  const query = el('searchInput').value.trim();
  if(!query) return;
  el('searchResults').innerHTML = '<div class="loading">搜尋中…</div>';

  try{
    const res = await fetch(API_URL, {
      method:'POST',
      body: JSON.stringify({ action:'searchAttendee', token: sessionToken, query })
    });
    const json = await res.json();
    if(!json.success){
      el('searchResults').innerHTML = `<div class="loading">${json.message}</div>`;
      return;
    }
    renderSearchResults(json.data);
  } catch(err){
    el('searchResults').innerHTML = '<div class="loading">搜尋失敗，請稍後再試</div>';
  }
}

function renderSearchResults(list){
  if(list.length === 0){
    el('searchResults').innerHTML = '<div class="loading">查無符合的人員</div>';
    return;
  }
  el('searchResults').innerHTML = list.map(a => `
    <div class="result-item">
      <div class="result-info">
        <div class="name">${a.Name}</div>
        <div class="meta">${a.Organization || ''} · ${a.TicketCode} · 桌${a.TableNo || '—'}/座${a.SeatNo || '—'}</div>
      </div>
      <button class="checkin-btn" data-code="${a.TicketCode}" ${a.CheckedIn ? 'disabled' : ''}>
        ${a.CheckedIn ? '已報到' : '報到'}
      </button>
    </div>
  `).join('');

  el('searchResults').querySelectorAll('.checkin-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      if(btn.disabled) return;
      btn.disabled = true;
      btn.textContent = '處理中…';
      const json = await checkin(btn.dataset.code, 'Manual');
      if(json.success){
        btn.textContent = '已報到';
      } else {
        btn.disabled = false;
        btn.textContent = '報到';
      }
    });
  });
}

// ---------- 總覽 ----------
async function loadOverview(){
  try{
    const res = await fetch(API_URL, {
      method:'POST',
      body: JSON.stringify({ action:'getOverview', token: sessionToken })
    });
    const json = await res.json();
    if(!json.success) return;

    el('statTotal').textContent = json.data.total;
    el('statCheckedIn').textContent = json.data.checkedIn;
    el('statRemaining').textContent = json.data.remaining;

    if(json.data.recentLog.length === 0){
      el('recentLog').innerHTML = '<div class="loading">尚無報到紀錄</div>';
      return;
    }
    el('recentLog').innerHTML = json.data.recentLog.map(l => `
      <div class="log-item">
        <div>
          <div>${l.Name || l.TicketCode}</div>
          <div class="log-time">${formatTime(l.Timestamp)} · ${l.Method || ''} · ${l.Result || ''}</div>
        </div>
      </div>
    `).join('');
  } catch(err){
    el('recentLog').innerHTML = '<div class="loading">載入失敗</div>';
  }
}

function formatTime(ts){
  if(!ts) return '';
  const d = new Date(ts);
  if(isNaN(d)) return ts;
  return d.toLocaleString('zh-TW', {month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'});
}

// ---------- 自動登入（若 session 尚有效）----------
if(sessionToken){
  enterMainScreen();
}
</script>

</body>
</html>
